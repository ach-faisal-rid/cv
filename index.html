<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Tambah Data</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📂 Portfolio Management</h1>
        
        <!-- Navigation -->
        <div class="nav-menu">
            <a href="index.html" class="active">📝 Tambah Data</a>
            <a href="view.php">👁️ Lihat Data</a>
        </div>

        <!-- Form Tambah Data -->
        <div class="form-container">
            <h2>Tambah Portfolio Baru</h2>
            
            <!-- Alert untuk pesan sukses/error -->
            <div id="alert" class="alert" style="display:none;"></div>

            <form id="portfolioForm" action="create.php" method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="judul">Judul Portfolio <span class="required">*</span></label>
                    <input type="text" id="judul" name="judul" placeholder="Masukkan judul portfolio" required>
                </div>

                <div class="form-group">
                    <label for="kategori">Kategori <span class="required">*</span></label>
                    <select id="kategori" name="kategori" required>
                        <option value="">Pilih Kategori</option>
                        <option value="Web Development">Web Development</option>
                        <option value="Mobile Apps">Mobile Apps</option>
                        <option value="UI/UX Design">UI/UX Design</option>
                        <option value="Graphic Design">Graphic Design</option>
                        <option value="Photography">Photography</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="deskripsi">Deskripsi <span class="required">*</span></label>
                    <textarea id="deskripsi" name="deskripsi" rows="5" placeholder="Tulis deskripsi portfolio..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="gambar">Gambar</label>
                    <input type="file" id="gambar" name="gambar" accept="image/*">
                    <small class="helper-text">Format: JPG, PNG, GIF (Max 2MB)</small>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">💾 Simpan Portfolio</button>
                    <button type="reset" class="btn btn-secondary">🔄 Reset</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
